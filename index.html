<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rustfall</title>
<meta name="description" content="Rustfall - an original pixel run-and-gun. Play solo or online co-op.">
<meta name="theme-color" content="#170a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rustfall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:RF;src:url(rf-font.ttf) format('truetype');font-display:swap}
html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0507;overflow:hidden;overscroll-behavior:none;
 touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:#fff}
#wrap{position:fixed;inset:0;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:#170a0f url(loading-bg.jpg) center/cover no-repeat;image-rendering:pixelated;font-family:RF,monospace}
#loader:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,4,6,.25),rgba(10,4,6,.78))}
#loader>*{position:relative}
#logo{font-size:clamp(28px,7vw,64px);color:#ffa040;text-shadow:0 4px 0 #b8380f,0 7px 0 #2a0710,0 0 24px rgba(255,140,40,.45);letter-spacing:2px}
#tag{font-size:clamp(8px,1.6vw,12px);color:#ffe6c4;margin:14px 0 26px;text-shadow:0 2px 0 #1a0408}
#bar{width:min(60vw,420px);height:14px;border:2px solid #ffbf6a;border-radius:4px;background:rgba(0,0,0,.55);padding:2px;box-sizing:content-box}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffd27a);border-radius:2px;transition:width .2s}
#msg{font-size:10px;color:#ffd9b0;margin-top:12px;min-height:12px;text-align:center;max-width:80vw;line-height:1.6}
#go{display:none;margin-top:6px;font-family:RF,monospace;font-size:clamp(12px,2.4vw,18px);color:#fff7ea;background:#c4561d;border:3px solid #ffc06a;
 border-radius:8px;padding:14px 30px;box-shadow:0 5px 0 #6a2208;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#rotate{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#170a0f;
 font-family:RF,monospace;font-size:12px;color:#ffd9b0;text-align:center;line-height:1.8;padding:24px}
#rotate .ph{width:46px;height:78px;border:4px solid #ffa040;border-radius:9px;animation:rot 1.8s infinite ease-in-out}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
/* in-app HTML dialogs (sign-in, room code) */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(8,3,6,.82);font-family:RF,monospace}
#modal .card{width:min(92vw,430px);max-height:92vh;overflow:auto;background:#24121a;border:3px solid #ffb35c;border-radius:12px;padding:16px 18px;
 box-shadow:0 8px 0 #4a1408;color:#ffe9cf;font-size:10px;line-height:1.7;-webkit-user-select:text;user-select:text}
#modal h2{font-size:14px;color:#ffa040;margin:0 0 10px;text-shadow:0 2px 0 #2a0710}
#modal button{font-family:RF,monospace;font-size:10px;color:#fff7ea;background:#c4561d;border:2px solid #ffc06a;border-radius:7px;padding:11px 12px;width:100%;margin:5px 0;cursor:pointer}
#modal button.alt{background:#3a2430;border-color:#8a6a72}
#modal button.g{background:#fff;color:#222;border-color:#ddd;display:flex;align-items:center;justify-content:center;gap:10px}
#modal input{font-family:system-ui,sans-serif;font-size:16px;width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border-radius:6px;border:2px solid #8a6a72;background:#120a0e;color:#fff}
#modal input.code{font-family:RF,monospace;font-size:28px;text-align:center;letter-spacing:12px;text-transform:uppercase}
#modal .row{display:flex;gap:8px}
#modal .err{color:#ff8a7a;min-height:14px}
#modal .muted{color:#b9a0a6;font-size:8px}
#modal ol{padding-left:18px;margin:6px 0}
#inst{display:none;margin-top:10px;font-family:RF,monospace;font-size:clamp(9px,1.6vw,12px);color:#ffe9cf;background:rgba(36,18,26,.85);border:2px solid #ffb35c;
 border-radius:8px;padding:9px 18px}
#ver{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:8px;font-size:8px;color:#c9a99a;opacity:.85}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:50;display:none;font-family:RF,monospace;font-size:10px;
 color:#fff7ea;background:#24121a;border:2px solid #ffb35c;border-radius:8px;padding:10px 14px;box-shadow:0 5px 0 #4a1408;align-items:center;gap:12px}
#toast button{font-family:RF,monospace;font-size:9px;color:#fff7ea;background:#c4561d;border:2px solid #ffc06a;border-radius:6px;padding:7px 10px}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="safe"></div>
<div id="loader">
 <div id="logo">RUSTFALL</div>
 <div id="tag">CANYON OUTPOST ASSAULT</div>
 <div id="bar"><div id="fill"></div></div>
 <div id="msg">LOADING...</div>
 <button id="go">TAP TO PLAY</button>
 <button id="inst">INSTALL APP</button>
 <div id="ver"></div>
</div>
<div id="toast"><span id="tmsg"></span><button id="tbtn">RESTART</button></div>
<div id="rotate"><div class="ph"></div>ROTATE YOUR PHONE<br>TO LANDSCAPE</div>
<div id="modal"><div class="card" id="mcard"></div></div>
<noscript>Rustfall needs JavaScript.</noscript>
<script>
// Capture Web Audio contexts so the tap-to-play gesture can unlock them (iOS Safari).
(function(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;window.__rfAC=[];
 const W=function(...a){const c=new AC(...a);window.__rfAC.push(c);return c;};W.prototype=AC.prototype;
 window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;})();
window.RF_BUILD="20261115184937";window.RF_VERSION="1.4.0";
// ---- app shell: install prompt, iOS hint, live-update checks
(function(){
 const A=window.RFApp={deferred:null,installed:false};
 const ua=navigator.userAgent;
 A.wrapper=/RustfallApp\//.test(ua);                       // our Android WebView wrapper
 A.ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 A.standalone=()=>A.wrapper||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();A.deferred=e;A.paint&&A.paint();});
 addEventListener('appinstalled',()=>{A.deferred=null;A.installed=true;A.paint&&A.paint();});
 // 'prompt' = Android/desktop Chrome can install, 'ios' = show Add-to-Home-Screen steps, '' = already an app / not possible
 A.state=()=>{if(A.standalone()||A.installed)return'';if(A.deferred)return'prompt';if(A.ios)return'ios';return'';};
 A.install=()=>{const st=A.state();
  if(st==='prompt'){const d=A.deferred;A.deferred=null;d.prompt();d.userChoice.then(r=>{if(r.outcome==='accepted')A.installed=true;A.paint&&A.paint();}).catch(()=>{});return;}
  if(st==='ios'&&window.RF&&RF.openModal){RF.openModal('<h2>INSTALL ON IPHONE</h2><ol><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><p class="muted">Rustfall then opens full screen like a normal app, and always runs the newest version.</p><button id="x">GOT IT</button>',c=>{c.querySelector('#x').onclick=RF.closeModal;});}};
 // live updates: compare the build baked into this page with the one on the server
 A.checking=false;
 A.check=(onNew)=>{if(A.checking)return;A.checking=true;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{A.checking=false;
   if(v&&v.build&&v.build!==window.RF_BUILD){A.latest=v;onNew(v);}}).catch(()=>{A.checking=false;});};
 A.reload=()=>{const n=+(sessionStorage.getItem('rfReload')||0);if(n>=2)return;sessionStorage.setItem('rfReload',n+1);
  const go=()=>location.replace(location.pathname+'?v='+(A.latest?A.latest.build:Date.now())+(location.search.includes('autostart')?'&autostart':''));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(r=>r?r.update():0).catch(()=>{}).then(go,go);}else go();};
 A.toast=(msg,btn)=>{const t=document.getElementById('toast');if(!t)return;document.getElementById('tmsg').textContent=msg;
  const b=document.getElementById('tbtn');b.style.display=btn?'':'none';b.onclick=()=>A.reload();t.style.display='flex';};
})();
</script>
<script src="index.js"></script>
<script src="rf.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8260224,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
(function(){
 const canvas=document.getElementById('canvas'),wrap=document.getElementById('wrap');
 const fill=document.getElementById('fill'),msg=document.getElementById('msg'),go=document.getElementById('go'),loader=document.getElementById('loader');
 // We size the canvas ourselves (inside the safe area) and cap the pixel ratio for speed.
 function fit(){const r=wrap.getBoundingClientRect(),cs=getComputedStyle(wrap);
  const w=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=r.height-parseFloat(cs.paddingBottom);
  const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(2,Math.round(w*dpr));canvas.height=Math.max(2,Math.round(h*dpr));}
 fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
 if(window.visualViewport)visualViewport.addEventListener('resize',fit);
 // stop iOS pinch / double-tap zoom and page bounce
 ['gesturestart','gesturechange','dblclick'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
 document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#modal'))e.preventDefault();},{passive:false});
 const cfg=Object.assign({},GODOT_CONFIG,{canvasResizePolicy:0,canvas:canvas});
 const engine=new Engine(cfg);
 const missing=Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
 if(missing.length){msg.textContent='This browser is missing: '+missing.join(', ');return;}
 let ready=false,tapped=false;
 const A=window.RFApp,inst=document.getElementById('inst');
 document.getElementById('ver').textContent='v'+window.RF_VERSION+'  build '+window.RF_BUILD.slice(4,8)+'.'+window.RF_BUILD.slice(8,12);
 A.paint=()=>{const st=A.state();inst.style.display=st?'block':'none';inst.textContent=st==='ios'?'INSTALL ON IPHONE':'INSTALL APP';};
 inst.addEventListener('click',()=>A.install());A.paint();
 // launch check: if this page is older than what's deployed, jump to the new build before the game boots
 A.check(()=>{if(!tapped){A.toast('Updating to the newest version...',false);A.reload();}else A.toast('New version ready',true);});
 // coming back to the app later: offer the update (auto-restart if still on the loading screen)
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')A.check(()=>{if(document.getElementById('loader')&&!tapped)A.reload();else A.toast('New version ready',true);});});
 setInterval(()=>{if(document.visibilityState==='visible')A.check(()=>A.toast('New version ready',true));},10*60*1000);
 function unlockAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  (window.__rfAC||[]).forEach(c=>{try{c.resume();}catch(e){}});
  try{const a=new Audio('data:audio/mp4;base64,AAAAHGZ0eXBNNEEgAAACAE00QSBpc29taXNvMgAAAAhmcmVlAAAAGm1kYXQAAAA=');a.play().catch(()=>{});}catch(e){}}
 function finish(){if(!ready||!tapped)return;loader.style.transition='opacity .35s';loader.style.opacity='0';setTimeout(()=>loader.remove(),400);canvas.focus();}
 go.addEventListener('click',()=>{tapped=true;unlockAudio();finish();});
 ['touchend','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
 engine.startGame({onProgress:(c,t)=>{if(c>0&&t>0){const p=Math.min(100,Math.round(c*100/t));fill.style.width=p+'%';msg.textContent='LOADING '+p+'%  ('+(t/1048576).toFixed(1)+' MB)';}}})
  .then(()=>{ready=true;fill.style.width='100%';msg.textContent=A.standalone()?'':(A.ios?'TIP: INSTALL IT FOR FULL SCREEN':'');go.style.display='block';
   A.paint();sessionStorage.removeItem('rfReload');setTimeout(()=>sessionStorage.removeItem('rfSwReload'),15000);
   if(/[?&]autostart/.test(location.search)){tapped=true;finish();}},
   e=>{console.error(e);msg.textContent='Could not start: '+(e&&e.message||e);});
 // a newer service worker just took over (e.g. first launch after a deploy that changed the worker):
 // if the player hasn't started yet, restart once so every file comes from the new build
 if('serviceWorker' in navigator && navigator.serviceWorker.controller){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!tapped&&!sessionStorage.getItem('rfSwReload')){sessionStorage.setItem('rfSwReload','1');location.reload();}});}
 if('serviceWorker' in navigator && window.isSecureContext && !/[?&]nosw/.test(location.search)){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(e=>console.warn('sw',e));}
})();
</script>
</body>
</html>
